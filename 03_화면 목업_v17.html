<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 생산성 측정 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 고정 앱 바(역할 + 3개 메뉴). 과제 현황 = 계층 표, 투입 공수 = 왼쪽 목록 1/3 + 오른쪽 상세 2/3, 대시보드 = 필터 → KPI → 분석 2 × 2. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#eaf0f0; --line:#d6dfe0; --line-2:#e6ecec;
  --fg:#132024; --fg-2:#46575c; --fg-3:#76868a;
  --accent:#0d5d6c; --accent-fg:#ffffff; --accent-soft:#d9ecef;
  --ai:#2a78d6; --hum:#eb6834; --base:#b6c1c3; --save:#1baf7a; --c4:#8a5cd1; --c6:#b48a12;
  --good:#17793a; --good-soft:#dff2e5; --warn:#a86400; --warn-soft:#fbeed4; --bad:#bf3030; --bad-soft:#f9e0e0;
  --t1:#2a78d6; --t2:#1baf7a; --t3:#8a5cd1; --t4:#3a9bb0; --t5:#eb6834; --t6:#b48a12; --t7:#9aa6a9; --t8:#c2477f;
  --font-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#162024; --surface-2:#1c282c; --line:#2b3a3f; --line-2:#223034;
  --fg:#e6eef0; --fg-2:#a8b7bb; --fg-3:#7b8b8f;
  --accent:#5fbccb; --accent-fg:#0b1c20; --accent-soft:#17383e;
  --ai:#3f8fe8; --hum:#e0703f; --base:#4b5a5e; --save:#2bb886; --c4:#9e7ae2; --c6:#c9a23a;
  --good:#52c47f; --good-soft:#163222; --warn:#e2a33a; --warn-soft:#3a2c12; --bad:#ef6d6d; --bad-soft:#3d1c1c;
  --t1:#3f8fe8; --t2:#2bb886; --t3:#9e7ae2; --t4:#4fb3c8; --t5:#e0703f; --t6:#c9a23a; --t7:#5d6b6e; --t8:#d4609a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --surface:#162024; --surface-2:#1c282c; --line:#2b3a3f; --line-2:#223034;
  --fg:#e6eef0; --fg-2:#a8b7bb; --fg-3:#7b8b8f;
  --accent:#5fbccb; --accent-fg:#0b1c20; --accent-soft:#17383e;
  --ai:#3f8fe8; --hum:#e0703f; --base:#4b5a5e; --save:#2bb886; --c4:#9e7ae2; --c6:#c9a23a;
  --good:#52c47f; --good-soft:#163222; --warn:#e2a33a; --warn-soft:#3a2c12; --bad:#ef6d6d; --bad-soft:#3d1c1c;
  --t1:#3f8fe8; --t2:#2bb886; --t3:#9e7ae2; --t4:#4fb3c8; --t5:#e0703f; --t6:#c9a23a; --t7:#5d6b6e; --t8:#d4609a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{text-wrap:balance;margin:0}
h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:600}h4{font-size:13px;font-weight:600}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand .tag{font-size:11px;color:var(--fg-3)}
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 14px 10px;cursor:pointer;color:var(--fg-2);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;text-align:center}

main{max-width:1320px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h .sub{font-size:12px;color:var(--fg-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;align-items:start}

.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:13px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--fg-3)}.small{font-size:12px}.xs{font-size:11px}
.ok{color:var(--good)}.ng{color:var(--bad)}.wn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;width:fit-content}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.kind{font-size:11px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap}
.kind.개발{background:color-mix(in srgb,var(--ai) 14%,transparent);color:var(--ai)}
.kind.운영{background:color-mix(in srgb,var(--c4) 16%,transparent);color:var(--c4)}
.ms-st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.ms-st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ms-st.대기 i{background:var(--fg-3)}.ms-st.대기{color:var(--fg-2)}
.ms-st.측정중 i{background:var(--warn)}.ms-st.측정중{color:var(--warn)}
.ms-st.완료 i{background:var(--good)}.ms-st.완료{color:var(--good)}
.stg{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:3px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--fg-2);background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tbody tr:last-child td{border-bottom:0}
.hbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--surface-2);min-width:70px}
.hbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fg-2);align-items:center}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lock{color:var(--fg-3);font-size:12px}

/* ---------- PoC 과제 현황 (양식 말판) ---------- */
.board{border-collapse:separate;border-spacing:0;font-size:12.5px}
.board th,.board td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:6px 9px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.board thead th{position:sticky;top:0;z-index:2;background:var(--surface-2)}
.board thead tr.band th{text-align:center;font-size:12px;color:var(--fg);top:0}
.board thead tr.cols th{top:31px;white-space:normal;vertical-align:top;line-height:1.35;min-width:84px}
.board thead tr.cols th .id{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);font-weight:500}
.board .stk{position:sticky;z-index:1}
.board thead .stk{z-index:3}
.board .s1{left:0;min-width:44px;max-width:44px}
.board .s2{left:44px;min-width:230px;max-width:230px;box-shadow:2px 0 0 var(--line);white-space:normal}
.board tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.board td.rep{color:var(--fg-3)}
.board th.band-m{background:color-mix(in srgb,var(--accent) 16%,var(--surface-2))}
.board .new{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;color:var(--accent)}
.board th.coll,.board td.coll{min-width:34px;max-width:34px;text-align:center;color:var(--fg-3);cursor:pointer;padding:6px 2px}
.board th.bandh{cursor:pointer}
.board th.bandh:hover{color:var(--accent)}
.prog{display:flex;flex-direction:column;gap:3px;min-width:110px}
.prog .hbar{height:6px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.kp button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.kp button b{font-family:var(--font-mono);font-size:21px;font-weight:500}
.kp button span{font-size:12px;color:var(--fg-2)}
.kp button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- 공수 실적 조회 ---------- */
.hist td.v{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;min-width:58px}
.hist td.v.z{color:var(--line)}
.hist td.v.unc{text-decoration:underline dotted var(--warn);text-underline-offset:3px}
.hist tr.req td{font-weight:600;background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.hist tr.prj td{background:var(--surface-2);font-weight:600;font-size:12px}
.hist tr.tot td{background:var(--surface-2);font-weight:600}
.hist td.nm{min-width:240px}
.hist th.dh{text-align:right;min-width:58px}
.hist th.dh small{display:block;font-weight:500;color:var(--fg-3)}
.hist th.dh.today{color:var(--accent)}

/* ---------- 투입 공수 입력 ---------- */
.una{border:1.5px solid var(--bad);background:color-mix(in srgb,var(--bad-soft) 55%,var(--surface));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.una-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.una-h b{color:var(--bad);font-size:14px}
.una-item{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
@media (max-width:760px){.una-item{grid-template-columns:1fr}}
.una-item .when b{font-family:var(--font-mono);font-size:13px}
.una-item .when div{font-size:11.5px;color:var(--fg-3)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chipset button:hover{border-color:var(--accent);color:var(--accent)}
.chipset button.rec{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chipset button.np{color:var(--fg-3)}
.ig{min-width:900px;font-size:13px}
.ig th,.ig td{padding:6px 8px}
.ig td.nm,.ig th.nm{position:sticky;left:0;z-index:1;background:var(--surface);min-width:250px;box-shadow:1px 0 0 var(--line-2)}
.ig th.nm{background:var(--surface-2)}
.ig tr.rq td{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface));padding-top:8px;padding-bottom:6px}
.ig tr.rq td.nm{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.ig th.day{min-width:128px}
.ig th.day .dst{display:block;font-weight:500;font-size:11px;margin-top:1px}
.ig th.day.sel{background:var(--accent-soft)}
.ig td.dc.sel{background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.ig td.dc.cf{background:color-mix(in srgb,var(--surface-2) 65%,var(--surface))}
.ig tr.ft td{background:var(--surface-2);font-size:12px}
.ig tr.ft td.nm{background:var(--surface-2)}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell .row{display:flex;align-items:center;gap:4px}
.cell .tot{font-family:var(--font-mono);font-size:15px;font-weight:500;min-width:36px;text-align:center}
.cell .tot.z{color:var(--line)}
.cell .stp{width:24px;height:24px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;line-height:1;font-size:15px;color:var(--fg-2);padding:0}
.cell .stp:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.cell .stp:disabled{opacity:.3;cursor:default}
.cell .meta{font-size:10.5px;font-family:var(--font-mono);color:var(--fg-3);white-space:nowrap}
.cell .meta .a{color:var(--ai)}
.cell .meta .up{color:var(--hum);font-weight:600}
.cell .meta .dn{color:var(--fg-2);font-weight:600}
.cfbtn{width:100%}

/* 업무 유형 */
.ty{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.ty i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.tyrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:5px}
.tyrow.on{border-color:var(--hum);background:color-mix(in srgb,var(--hum) 7%,var(--surface))}
.tyrow .d{font-size:11.5px;color:var(--fg-3)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-size:16px;padding:0}
.stepper b{font-family:var(--font-mono);font-size:14px;min-width:34px;text-align:center}
.aut{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.aut.자동화{background:var(--good-soft);color:var(--good)}
.aut.일부{background:var(--warn-soft);color:var(--warn)}
.aut.사람{background:var(--surface-2);color:var(--fg-2)}
.aut.보정{background:var(--bad-soft);color:var(--bad)}

/* ---------- 대시보드 ---------- */
.fbar{position:sticky;top:96px;z-index:15}
.ms{position:relative}
.ms-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12.5px;max-width:280px}
.ms-btn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn.on{border-color:var(--accent);color:var(--accent)}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(10,20,22,.16);width:min(340px,86vw);max-height:360px;display:flex;flex-direction:column}
.ms-pop .top{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line-2);align-items:center}
.ms-pop .top input{flex:1;min-width:0}
.ms-pop .list{overflow:auto;padding:4px 0}
.ms-pop label{display:flex;gap:8px;align-items:center;padding:5px 12px;font-size:13px;cursor:pointer}
.ms-pop label:hover{background:var(--surface-2)}
.ms-pop .grp{padding:6px 12px 2px;font-size:11px;color:var(--fg-3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px}
.chips span button{border:0;background:none;color:inherit;cursor:pointer;font-size:13px;padding:0 4px}
.kpi4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.kc{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kc .area{font-size:12px;color:var(--fg-3);display:flex;justify-content:space-between;gap:6px}
.kc .nm{font-size:13px;font-weight:600}
.kc .vrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kc .v{font-family:var(--font-mono);font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kc .f{font-size:11px;color:var(--fg-3)}
.kc .subs{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.kc .subs .sl{font-size:11px;color:var(--fg-3);font-weight:600}
.mini{display:grid;grid-template-columns:52px minmax(0,1fr) 46px;gap:6px;align-items:center;font-size:11.5px}
.mini .hbar{height:7px;min-width:0}
.mini .num{text-align:right}
.kv{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.kv b{font-family:var(--font-mono);font-weight:500}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--fg-2);font-family:var(--font-body);font-size:11px}
.chart .val{fill:var(--fg);font-family:var(--font-mono);font-size:10.5px}
.chart .grid{stroke:var(--line-2)}
.chart .axis{stroke:var(--line)}
.prow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 60px 60px 60px;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.prow.h{font-size:11.5px;color:var(--fg-2);font-weight:600;padding-top:0}
.prow.g{font-weight:600;cursor:pointer}
.prow.g .nm::before{content:"▾ ";color:var(--fg-3)}
.prow.g.closed .nm::before{content:"▸ "}
.prow.s .nm{padding-left:16px;color:var(--fg-2)}
.prow .r{text-align:right;font-family:var(--font-mono)}
.bars2{display:flex;flex-direction:column;gap:3px}
.bars2 .b{display:flex;align-items:center;gap:6px;font-size:10.5px;font-family:var(--font-mono);color:var(--fg-3)}
.bars2 .b span.track{display:flex;height:9px;border-radius:2px;overflow:hidden}

/* 결함 (통합 테스트 · 리뷰, 산식 협의 중) · 산출물 신뢰도 설문 */
const DEF={'REQ-0033':0,'REQ-0038':1,'REQ-0012':0,'REQ-0055':1,'REQ-0021':0,'REQ-0027':1,'REQ-0071':0,'REQ-0072':0,'REQ-0074':0,'REQ-0093':0};
const SURVEY={'REQ-0033':4.2,'REQ-0038':3.8,'REQ-0012':4.5,'REQ-0055':3.6,'REQ-0058':4.4,'REQ-0021':4.3,'REQ-0027':3.2,'REQ-0071':4.6,'REQ-0072':3.9,'REQ-0074':4.8,'REQ-0083':4.0,'REQ-0092':4.1,'REQ-0093':3.5};

/* =================== 계산 =================== */
const addSum=o=>sum(Object.values(o));
function cell(code,i){const d=D[code];const ai=Math.round(d.ai[i]/6)/10;const add=q1(addSum(d.add[i]));const mn=Math.min(ai,d.minus[i]);const inT=q1(Math.max(0,ai-mn));return{ai,add,mn,inT,tot:q1(inT+add)};}
function uStats(u,days=ALLD){let inT=0,out=0,cost=0,last=-1;const byType={};
  days.forEach(i=>{const x=cell(u.code,i);inT+=x.inT;out+=x.add;cost+=x.ai*RATE(u);if(x.ai||x.add)last=i;Object.entries(D[u.code].add[i]).forEach(([t,h])=>byType[t]=(byType[t]||0)+h);});
  const tot=inT+out,md=tot/8,price=PRICE[u.r.grade];
  return{inT,out,tot,md,base:u.s.base,cost,baseCost:u.s.base*price,labor:md*price,byType,last};}
function aggU(units){const S=units.map(u=>uStats(u));
  const o={n:new Set(units.map(u=>u.r.id)).size,base:sum(S,x=>x.base),md:sum(S,x=>x.md),inT:sum(S,x=>x.inT),tot:sum(S,x=>x.tot),bc:sum(S,x=>x.baseCost),lc:sum(S,x=>x.labor),ai:sum(S,x=>x.cost),byType:{}};
  S.forEach(x=>Object.entries(x.byType).forEach(([t,h])=>o.byType[t]=(o.byType[t]||0)+h));
  o.out=o.tot-o.inT;o.tc=o.lc+o.ai;o.save=o.base?(o.base-o.md)/o.base:NaN;o.net=o.bc?(o.bc-o.lc-o.ai)/o.bc:NaN;o.use=o.tot?o.inT/o.tot:NaN;return o;}
const agg=list=>aggU(list.flatMap(unitsOf));
const reqStats=r=>aggU(unitsOf(r));
const ST_NAME={done:'완료',ing:'진행 중',wait:'대기'};
function stageSt(r,s){if(r.done)return'done';const us=unitsOf(r).map(u=>({u,st:uStats(u)}));const me=us.find(x=>x.u.s===s);
  if(me.st.last<0)return'wait';const mx=Math.max(...us.map(x=>x.st.last));return me.st.last>=mx-1?'ing':'done';}  /* 최근 활동일 기준 추정 · 실제로는 관리자 · 담당자가 단계 완료 지정 */
function status(r){if(r.done)return'완료';return reqStats(r).tot>0?'측정중':'대기';}

function rowHas(dev,r,i){if(EXTRA.has(k3(dev,r.id,i)))return true;return myUnits(r,dev).some(u=>{const d=D[u.code];return d.ai[i]>0||Object.keys(d.add[i]).length>0||d.minus[i]>0;});}
function rowSt(dev,r,i){const key=k3(dev,r.id,i);
  if(i===TODAY)return(!r.done||rowHas(dev,r,i))?'today':null;
  if(CONF.has(key))return'conf';if(EDIT.has(key))return'edit';return rowHas(dev,r,i)?'need':null;}
const needDays=(dev,r)=>ALLD.filter(i=>i<TODAY&&['need','edit'].includes(rowSt(dev,r,i)));
const needOf=(dev,r)=>dev?needDays(dev,r).length:sum(ownersOf(r),o=>needDays(o,r).length);
const myUna=dev=>UNA.filter(u=>!dev||u.dev===dev);
function badgeN(){return sum(REQS.filter(r=>isOwner(r,ME)),r=>needDays(ME,r).length)+myUna(ME).length;}

    if(!s)return`<i class="off" data-tip="${SN[c]} · 측정 대상 아님"></i>`;const ss=stageSt(r,s);
    return`<i class="${ss} ${dev&&s.owner!==dev?'oth':''}" data-tip="${SN[c]} · ${esc(s.wt)}\n담당 ${s.owner} · 기준 ${f1(s.base)} M/D · ${ST_NAME[ss]}"></i>`;}).join('')}</div>`;}

 p:[['','구분',null,p=>`<span class="kind ${p.kind}">${p.kind}</span>`],['PRJ-02','대상 시스템명',null,p=>esc(p.sys)],['추가','SK AX 소속팀',null,p=>esc(p.axTeam)],['PRJ-03','하이닉스 담당',null,p=>p.dept],['PRJ-04','하이닉스 시스템 담당팀',null,p=>esc(p.team)],['PRJ-05','작성자 (PM)',null,p=>p.pm],

    cs.forEach(c=>cols+=`<th class="${b==='g'?'bg-g':'nowrap'}"><span class="id">${c[0]||'&nbsp;'}</span>${c[1]}${c[0]==='추가'?'':''}</th>`);});
  const pids=[...new Set(rows.map(r=>r.pid))];let n=0;
  const body=pids.map((pid,pi)=>{const p=prj(pid);const rs=rows.filter(r=>r.pid===pid);const all=mine.filter(r=>r.pid===pid);const cl=ST1.pc.has(pid);
    const A=agg(all),done=all.filter(r=>r.done).length;
    const ubar=`<div class="sbar">${SC.map(c=>{const k=all.filter(r=>r.stages.some(s=>s.c===c)).length;return k?`<i class="prj" data-tip="${SN[c]} · 요구사항 ${k}건"></i>`:`<i class="off" data-tip="${SN[c]} · 측정 대상 없음"></i>`;}).join('')}</div>`;
    let g=`<tr class="grp"><td class="stk s1 num">${String.fromCharCode(65+pi)}</td><td class="stk s2" data-pc="${pid}" data-tip="${cl?'요구사항 펼치기':'요구사항 접기'}"><div>${cl?'▸':'▾'} ${esc(p.name)} <span class="kind ${p.kind}">${p.kind}</span></div>
      <div class="gprog"><span class="xs muted">완료 ${done}/${all.length}</span><div class="hbar" data-tip="과제 투입 ${f1(A.md)} / 기준 ${f1(A.base)} M/D"><i style="width:${Math.min(100,A.md/A.base*100)}%;background:var(--accent)"></i></div><span class="xs num">${f1(A.md)} / ${f1(A.base)}</span></div></td><td class="stk s3">${ubar}</td>`;

      BANDS.forEach(([b])=>{if(!vis(b)){tds+=`<td class="coll" data-band="${b}">…</td>`;return;}

      return`<tr class="rq">${tds}</tr>`;}).join('');}).join('');
  const dev=role==='dev';
  return`<div class="head"><h2>PoC 과제 현황</h2>
    <div class="acts">${dev?'<span class="small muted">내 담당 요구사항이 있는 과제만 표시</span>':''}<button class="btn primary" id="regOpen">＋ 기준정보 입력</button><button class="btn" id="upXls">양식 올리기 (xlsx)</button><button class="btn" id="dnXls">양식 내려받기</button></div></div>

function openReg(){
  REG={tab:'req',rows:[],prj:[],lastPid:''};REG.rows=[blankReqRow(),blankReqRow(),blankReqRow()];REG.prj=[{name:'',kind:'',sys:'',axTeam:'',dept:'',team:'',pm:'',grade:'',deploy:'',area:'',wbs:'',vcs:'',pms:''}];
  modal('<div id="regBox"></div>',m=>{m.classList.add('xwide');drawReg(m);});
}
function pidOpts(){const ps=PROJECTS.filter(p=>role==='admin'||REQS.some(r=>r.pid===p.id&&isOwner(r,ME))||p.newBy===ME);return ps;}
function drawReg(m){
  const box=m.querySelector('#regBox');const dev=role==='dev';
  const reqRows=REG.rows.map((r,i)=>`<tr data-i="${i}">
    <td class="num xs muted">${i+1}</td>
    <td><select data-f="pid"><option value="">과제 선택</option>${pidOpts().map(p=>`<option value="${p.id}" ${p.id===r.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td>
    <td><input type="text" data-f="id" value="${esc(r.id)}" placeholder="REQ-0000" style="width:96px"></td>
    <td><input type="text" data-f="name" value="${esc(r.name)}" placeholder="요구사항명" style="width:160px"></td>
    <td>${sel('sdlc',SDLC.map(x=>x[1]),r.sdlc?SN[r.sdlc]:'')}</td>
    <td>${sel('wt',r.sdlc?WT[r.sdlc]:[],r.wt,r.sdlc?'':'disabled')}</td>
    <td><input type="number" step="0.1" min="0" data-f="base" value="${r.base}" placeholder="0.0" style="width:64px"></td>
    <td>${dev?`<span class="small">${ME}</span>`:sel('owner',DEVS,r.owner)}</td>
    <td>${sel('diff',OPT.diff,r.diff)}</td><td>${sel('grade',OPT.dgrade,r.grade)}</td><td>${sel('src',OPT.src,r.src)}</td>
    <td class="nowrap"><button class="btn sm ghost" data-dup="${i}" data-tip="아래에 복제 (다른 단계 입력용)">복제</button><button class="btn sm ghost" data-del="${i}" aria-label="행 삭제">✕</button></td></tr>`).join('');
  const prjRows=REG.prj.map((p,i)=>`<tr data-i="${i}">
    <td class="num xs muted">${i+1}</td>
    <td><input type="text" data-f="name" value="${esc(p.name)}" placeholder="과제명" style="width:150px"></td>
    <td>${sel('kind',OPT.kind,p.kind)}</td>
    <td><input type="text" data-f="sys" value="${esc(p.sys)}" placeholder="대상 시스템" style="width:100px"></td>
    <td><input type="text" data-f="axTeam" value="${esc(p.axTeam)}" placeholder="AX 팀" style="width:100px"></td>
    <td>${sel('dept',OPT.dept,p.dept)}</td>
    <td><input type="text" data-f="team" value="${esc(p.team)}" placeholder="하이닉스 팀" style="width:100px"></td>
    <td><input type="text" data-f="pm" value="${esc(p.pm)}" placeholder="PM" style="width:70px"></td>
    <td>${sel('grade',OPT.grade,p.grade)}</td><td>${sel('deploy',OPT.deploy,p.deploy)}</td><td>${sel('area',OPT.area,p.area)}</td>
    <td>${sel('wbs',OPT.wbs,p.wbs)}</td><td>${sel('vcs',OPT.vcs,p.vcs)}</td><td>${sel('pms',OPT.pms,p.pms)}</td>
    <td><button class="btn sm ghost" data-pdel="${i}" aria-label="행 삭제">✕</button></td></tr>`).join('');
  box.innerHTML=`<div class="panel-h"><h3>기준정보 입력</h3><div class="seg" id="regTab"><button data-t="req" aria-pressed="${REG.tab==='req'}">요구사항 · SDLC 단계</button><button data-t="prj" aria-pressed="${REG.tab==='prj'}">과제</button></div></div>
  <p class="small muted">${REG.tab==='req'?'한 줄 = 요구사항 × SDLC 단계. 같은 요구사항의 단계가 여러 개면 「복제」로 줄을 늘려 단계만 바꿉니다. 선택값은 과제 선정 양식 코드값과 같습니다.':'과제를 먼저 등록하면 요구사항 줄의 과제 목록에 나타납니다.'}${dev?' 개발자는 본인 담당 단계만 등록할 수 있고, 등록 내역은 관리자에게 이력으로 남습니다.':''}</p>
  <div class="tw regw">${REG.tab==='req'?`<table class="reg"><thead><tr><th>#</th><th>과제</th><th>요구사항 ID</th><th>요구사항명</th><th>SDLC 단계</th><th>업무 유형</th><th>단계 기준 M/D</th><th>담당</th><th>난이도</th><th>필요 등급</th><th>공수 출처</th><th></th></tr></thead><tbody>${reqRows}</tbody></table>`
    :`<table class="reg"><thead><tr><th>#</th><th>과제명</th><th>구분</th><th>대상 시스템</th><th>SK AX 소속팀</th><th>하이닉스 담당</th><th>하이닉스 시스템 담당팀</th><th>PM</th><th>시스템 등급</th><th>배포 형식</th><th>과제 영역</th><th>WBS 실적</th><th>버전관리</th><th>작업관리</th><th></th></tr></thead><tbody>${prjRows}</tbody></table>`}</div>
  <div class="acts"><button class="btn" id="regAdd">＋ 행 추가</button><button class="btn" id="regAdd5">＋ 5행</button><span class="small ng" id="regErr" style="flex:1"></span><button class="btn primary" id="regSave">저장</button><button class="btn" data-close>닫기</button></div>`;
  const list=REG.tab==='req'?REG.rows:REG.prj;
  box.querySelector('#regTab').onclick=e=>{const b=e.target.closest('button');if(!b)return;REG.tab=b.dataset.t;drawReg(m);};
  box.querySelectorAll('[data-f]').forEach(el=>{const tr=el.closest('tr');const i=+tr.dataset.i;const f=el.dataset.f;
    el.onchange=el.oninput=()=>{let v=el.value;const row=list[i];
      if(f==='sdlc'){const c=SDLC.find(x=>x[1]===v);row.sdlc=c?c[0]:'';row.wt='';drawReg(m);return;}
      if(f==='pid'){row.pid=v;REG.lastPid=v;return;}
      row[f]=v;};});
  box.querySelector('#regAdd').onclick=()=>{list.push(REG.tab==='req'?blankReqRow():{name:'',kind:'',sys:'',axTeam:'',dept:'',team:'',pm:'',grade:'',deploy:'',area:'',wbs:'',vcs:'',pms:''});drawReg(m);};
  box.querySelector('#regAdd5').onclick=()=>{for(let k=0;k<5;k++)list.push(REG.tab==='req'?blankReqRow():{name:'',kind:'',sys:'',axTeam:'',dept:'',team:'',pm:'',grade:'',deploy:'',area:'',wbs:'',vcs:'',pms:''});drawReg(m);};
  box.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dup;const c={...REG.rows[i],sdlc:'',wt:'',base:''};REG.rows.splice(i+1,0,c);drawReg(m);});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{REG.rows.splice(+b.dataset.del,1);if(!REG.rows.length)REG.rows.push(blankReqRow());drawReg(m);});
  box.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{REG.prj.splice(+b.dataset.pdel,1);drawReg(m);});
  box.querySelector('#regSave').onclick=()=>saveReg(m);
}
function saveReg(m){
  const err=t=>{m.querySelector('#regErr').textContent=t;};
  if(REG.tab==='prj'){
    const ps=REG.prj.filter(p=>p.name.trim());if(!ps.length)return err('과제명을 넣어 주세요.');
    const bad=ps.find(p=>!p.kind||!p.sys||!p.axTeam||!p.dept||!p.team||!p.grade||!p.deploy||!p.area);if(bad)return err(`「${bad.name}」 필수 칸(구분 · 시스템 · 소속팀 · 담당 · 등급 · 배포 · 영역)이 비었습니다.`);
    ps.forEach(p=>{const id='P'+(PROJECTS.length+1);PROJECTS.push({id,name:p.name.trim(),sys:p.sys,dept:p.dept,team:p.team,pm:p.pm||'-',grade:p.grade,deploy:p.deploy,area:p.area,wbs:p.wbs||'없음',vcs:p.vcs||'없음',pms:p.pms||'없음',kind:p.kind,axTeam:p.axTeam,newBy:role==='dev'?ME:'관리자'});});
    REGLOG.unshift({at:'11/13 16:2x',who:role==='dev'?ME:'관리자',what:`과제 ${ps.length}건 등록 (${ps.map(p=>p.name).join(', ')})`,n:ps.length});
    REG.prj=[{name:'',kind:'',sys:'',axTeam:'',dept:'',team:'',pm:'',grade:'',deploy:'',area:'',wbs:'',vcs:'',pms:''}];REG.tab='req';toast(`과제 ${ps.length}건을 등록했습니다. 이제 요구사항 줄에서 고를 수 있습니다.`);drawReg(m);return;}
  const rs=REG.rows.filter(r=>r.id.trim()||r.name.trim()||r.sdlc);if(!rs.length)return err('입력한 줄이 없습니다.');
  for(const[k,r]of rs.entries()){const no=REG.rows.indexOf(r)+1;
    if(!r.pid||!r.id.trim()||!r.name.trim()||!r.sdlc||!r.wt||!(parseFloat(r.base)>0)||!r.owner||!r.diff||!r.grade||!r.src)return err(`${no}번 줄: 필수 칸이 비었습니다.`);
    if(!/^REQ-\d{4}$/i.test(r.id.trim()))return err(`${no}번 줄: 요구사항 ID는 REQ-0000 형식입니다.`);
    const ex=req(r.id.trim().toUpperCase());if(ex&&ex.stages.some(s=>s.c===r.sdlc))return err(`${no}번 줄: ${ex.id} ${SN[r.sdlc]} 단계는 이미 있습니다.`);}
  const keys=rs.map(r=>r.id.trim().toUpperCase()+'-'+r.sdlc);if(new Set(keys).size!==keys.length)return err('같은 요구사항 · 단계 줄이 두 번 있습니다.');
  const byReq={};rs.forEach(r=>{const id=r.id.trim().toUpperCase();(byReq[id]=byReq[id]||[]).push(r);});
  let nReq=0,nSt=0;
  Object.entries(byReq).forEach(([id,list])=>{const f=list[0];let r=req(id);
    if(!r){r=R(id,f.pid,f.name.trim(),f.diff,f.grade,f.src,list.map(x=>[x.sdlc,x.wt,x.owner,q1(parseFloat(x.base))]),false,{reg:'화면'});r.stages.sort((a,b)=>SC.indexOf(a.c)-SC.indexOf(b.c));REQS.push(r);nReq++;}
    else{list.forEach(x=>r.stages.push({c:x.sdlc,wt:x.wt,owner:x.owner,base:q1(parseFloat(x.base))}));r.stages.sort((a,b)=>SC.indexOf(a.c)-SC.indexOf(b.c));r.base=q1(sum(r.stages,s=>s.base));}
    list.forEach(x=>{const code=id+'-'+x.sdlc;const u={r,s:r.stages.find(s=>s.c===x.sdlc),code};ALLU.push(u);UC[code]=u;D[code]=blank();nSt++;});});
  REGLOG.unshift({at:'11/13 16:2x',who:role==='dev'?ME:'관리자',what:`요구사항 ${Object.keys(byReq).join(', ')} · SDLC 단계 ${nSt}개 등록`,n:nSt});
  closeModal();toast(`요구사항 ${Object.keys(byReq).length}건 · SDLC 단계 ${nSt}개를 등록했습니다. 측정 대기로 표시됩니다.`);render();
}

/* =================== 2. 투입 공수 (입력 · 실적) =================== */
const ST2={dev:'',prj:'',f:new Set(['need','ing']),sel:new Set(),una:false,hist:new Set()};
const effDev=()=>role==='dev'?ME:ST2.dev;
function effBase(){const dev=effDev();return REQS.filter(r=>(dev?isOwner(r,dev):true)&&(!ST2.prj||(ST2.prj==='개발'||ST2.prj==='운영'?prj(r.pid).kind===ST2.prj:r.pid===ST2.prj)));}
const FKEYS=[['need','확정 필요'],['ing','측정 중'],['done','측정 완료'],['wait','측정 대기']];
function fHit(r,k){const st=status(r);return k==='need'?needOf(effDev(),r)>0:k==='ing'?st==='측정중':k==='done'?st==='완료':st==='대기';}
const passF=r=>[...ST2.f].some(k=>fHit(r,k));
function reqCard(r,dev){const p=prj(r.pid);const need=needOf(dev,r);const st=status(r);const s=reqStats(r);const sel=ST2.sel.has(r.id);
  return`<div class="rc ${sel?'sel':''}" data-rc="${r.id}" role="button" tabindex="0" aria-pressed="${sel}">
    <input type="checkbox" data-mc="${r.id}" ${sel?'checked':''} aria-label="${esc(r.name)} 함께 보기" data-tip="체크하면 여러 요구사항을 함께 봅니다">
    <div class="rcb"><div class="xs muted">${esc(p.name)} <span class="kind ${p.kind}">${p.kind}</span>${!dev?` · ${ownersOf(r).join(', ')}`:''}</div>
      <div class="rcn"><b>${esc(r.name)}</b> <span class="xs muted mono">${r.id}</span></div>
      ${sdlcBar(r,dev)}
      <div class="rcm">${stChip(st)}${need?`<span class="pill warn">확정 필요 ${need}일</span>`:''}<span class="xs muted num" style="margin-left:auto">${f1(s.md)} / ${f1(r.base)} M/D</span></div></div></div>`;}
function renderEffort(){
  const dev=effDev(),ro=role!=='dev';
  const base=effBase(),list=base.filter(passF),una=myUna(dev);
  [...ST2.sel].forEach(id=>{if(!base.some(r=>r.id===id))ST2.sel.delete(id);});
  if(!ST2.sel.size&&!ST2.una&&list.length){const f=list.find(r=>needOf(dev,r)>0)||list[0];ST2.sel.add(f.id);}
  const prjOpts=PROJECTS.filter(p=>REQS.some(r=>r.pid===p.id&&(dev?isOwner(r,dev):true)));
  const left=`<aside class="lp" aria-label="요구사항 목록">
    <div class="box">
      ${role==='admin'?`<label class="fl">담당자 <select id="e2Dev"><option value="">전체</option>${DEVS.map(d=>`<option ${ST2.dev===d?'selected':''}>${d}</option>`).join('')}</select><span class="pill neutral">조회 전용</span></label>`:''}
      <label class="fl">과제 <select id="e2Prj" style="flex:1;min-width:0"><option value="">전체</option><option value="개발" ${ST2.prj==='개발'?'selected':''}>개발 과제 전체</option><option value="운영" ${ST2.prj==='운영'?'selected':''}>운영 과제 전체</option>
        ${prjOpts.map(p=>`<option value="${p.id}" ${ST2.prj===p.id?'selected':''}>${esc(p.name)} · ${p.kind}</option>`).join('')}</select></label>
      <div class="cks">${FKEYS.map(([k,l])=>`<label><input type="checkbox" data-fk="${k}" ${ST2.f.has(k)?'checked':''}>${l} <span class="num">${base.filter(r=>fHit(r,k)).length}</span></label>`).join('')}</div>
    </div>
    ${una.length?`<button class="chk ${ST2.una?'on':''}" id="e2Una" aria-expanded="${ST2.una}"><b>확인 필요 · 업무 코드 없이 잡힌 AI 사용 ${una.length}건 · ${h1(sum(una,u=>u.min)/60)}h</b><span class="small">${ro?'개발자가 요구사항에 배정하거나 업무 외로 표시해야 합니다':'요구사항 · 단계에 배정하거나 업무 외 사용으로 표시해 주세요'}</span></button>`
      :`<div class="chk none"><b>확인 필요 없음</b><span class="small muted">업무 코드 없이 잡힌 AI 사용이 없습니다${EXCL?` · 업무 외 표시 ${EXCL}건`:''}</span></div>`}
    <div class="small muted" style="display:flex;justify-content:space-between;gap:6px"><span>${dev?`${dev} 담당`:'전체'} 요구사항 ${list.length}건</span><span>☐ 체크 = 함께 보기</span></div>
    <div class="list">${list.map(r=>reqCard(r,dev)).join('')||'<p class="muted small">조건에 맞는 요구사항이 없습니다. 위 체크를 바꿔 보세요.</p>'}</div>
  </aside>`;
  const panels=[...ST2.sel].map(id=>reqPanel(req(id),dev,ro)).join('');
  const right=`<section class="rp">${ST2.una?unaPanel(dev,ro):''}${panels||(!ST2.una?'<div class="panel"><p class="muted">왼쪽에서 요구사항을 고르세요.</p></div>':'')}</section>`;
  return`<div class="head"><h2>투입 공수 <span class="muted" style="font-weight:500">· 입력 · 실적</span></h2>
    <span class="bar-note"><i></i>AI 사용 시간은 매일 06:00에 전일분 반영 · 최근 반영 11/13 06:00 (11/12분) · 오늘분은 내일 아침 확정</span></div>
  <div class="ef">${left}${right}</div>`;
}
function reqPanel(r,dev,ro){const p=prj(r.pid);const st=status(r);const A=reqStats(r);
  const owners=dev?[dev]:ownersOf(r);
  const strip=`<div class="strip">${SC.map(c=>{const s=r.stages.find(x=>x.c===c);
    if(!s)return`<div class="sbox off"><div class="sbh"><b>${SN[c]}</b></div><span>측정 대상 아님</span></div>`;
    const u=UC[r.id+'-'+c],us=uStats(u),ss=stageSt(r,s);
    return`<div class="sbox ${ss} ${dev&&s.owner===dev?'mine':''}"><div class="sbh"><b>${SN[c]}</b><span class="sst ${ss}">${ST_NAME[ss]}</span></div>
      <span class="wt" data-tip="${esc(s.wt)}">${esc(s.wt)}</span><span class="xs muted">${s.owner}${dev&&s.owner!==dev?' 담당':''}</span>
      <span class="num xs">${f1(us.md)} / ${f1(s.base)} M/D</span><div class="hbar"><i style="width:${Math.min(100,us.md/s.base*100)}%;background:${ss==='done'?'var(--good)':'var(--warn)'}"></i></div></div>`;}).join('')}</div>`;
  const cmds=role==='dev'&&!r.done?myUnits(r,ME).map(u=>`<span class="cmd">poc ${u.code}<button class="cp" data-cp="poc ${u.code}">복사</button></span>`).join(''):'';
  return`<article class="panel rq" data-rp="${r.id}">
    <div class="rqh"><div><div class="small muted">${esc(p.name)} <span class="kind ${p.kind}">${p.kind}</span> · ${esc(p.sys)} · ${p.team}</div>
      <h3>${esc(r.name)} <span class="mono small muted">${r.id}</span></h3></div>
      <div class="rqs">${stChip(st)}<span class="small">투입 <b class="num">${f1(A.md)}</b> / 기준 <b class="num">${f1(r.base)}</b> M/D</span>
        <span class="small">AI 도구 내 <b class="num" style="color:var(--ai)">${h1(A.inT)}h</b> · 외 <b class="num" style="color:var(--hum)">${h1(A.out)}h</b></span>
        ${ST2.sel.size>1?`<button class="btn sm ghost" data-xrp="${r.id}">닫기</button>`:''}</div></div>
    ${strip}
    ${cmds?`<div class="cmds"><span class="small muted">AI 도구 명령어 · 대화를 시작할 때 입력</span>${cmds}<span class="xs muted">업무 외 사용: <span class="mono">poc off</span> · 없는 코드 · 남의 단계는 입력 즉시 안내</span></div>`:''}
    ${owners.filter(o=>isOwner(r,o)).map(o=>effTable(r,o,ro)).join('')}
  </article>`;}
function effTable(r,dev,ro){
  const us=myUnits(r,dev),myC=new Set(us.map(u=>u.s.c));
  const rows=ALLD.slice().reverse().map(i=>({i,st:rowSt(dev,r,i)})).filter(x=>x.st);
  const act=rows.filter(x=>x.st!=='conf'),hist=rows.filter(x=>x.st==='conf');
  const hk=`${dev}|${r.id}`,open=ST2.hist.has(hk);
  const tot=c=>{const u=us.find(u=>u.s.c===c);return u?sum(hist,x=>cell(u.code,x.i).tot):0;};
  const allTot=sum(SC,tot);
  const head=`<tr><th>일자</th>${SC.map(c=>{const s=r.stages.find(x=>x.c===c);return`<th class="${myC.has(c)?'':'na'}">${SN[c]}<small>${s?(myC.has(c)?esc(s.wt):s.owner+' 담당'):'—'}</small></th>`;}).join('')}<th class="r">합계 (h)</th><th>확정</th></tr>`;
  const sumRow=`<tr class="sumr"><td>확정 합계<small>${hist.length}일</small></td>${SC.map(c=>`<td class="c num ${myC.has(c)?'':'na'}">${myC.has(c)?h1(tot(c)):''}</td>`).join('')}<td class="r num">${h1(allTot)}<small>${f2(allTot/8)} M/D</small></td><td></td></tr>`;
  const needN=act.filter(x=>x.st!=='today').length;
  return`<div class="etw">${!effDev()&&ownersOf(r).length>1?`<div class="small"><b>${dev}</b> 담당 단계</div>`:''}
  <div class="tw"><table class="et"><thead>${head}</thead><tbody>${sumRow}

function nice(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
function waterfall(list,stages){
  const W=560,H=250,L=48,B=H-34,T=18;
  let steps=[];const base=agg(list);
  if(F.wf==='cost'){steps.push(['기준 인건비',base.bc,'b']);stages.forEach(c=>{const a=byStage(list,c);steps.push([SN[c],a.lc-a.bc,'d']);});steps.push(['AI 비용',base.ai,'ai']);steps.push(['측정 총비용',base.tc,'t']);}
  else if(F.wf==='md'){steps.push(['기준 공수',base.base,'b']);stages.forEach(c=>{const a=byStage(list,c);steps.push([SN[c],a.md-a.base,'d']);});steps.push(['투입 공수',base.md,'t']);}
  else{stages.forEach(c=>{const a=byStage(list,c);steps.push([SN[c],a.ai,'ai']);});steps.push(['AI 비용 합계',base.ai,'t']);}
  const isMD=F.wf==='md',fmt=v=>isMD?(Math.abs(v)<10?f1(v):f0(v)):man(v);
  let acc=0;const bars=[];steps.forEach(([l,v,k])=>{let a,b;
    if(k==='b'||k==='t'){a=0;b=v;acc=k==='b'?v:acc;}else{a=acc;b=acc+v;acc=b;}
    if(F.wf==='ai'&&k==='ai'){a=acc-v;b=acc;}bars.push({l,v,k,a,b});});
  const raw=Math.max(...bars.map(x=>Math.max(x.a,x.b)))*1.1||1;const st=nice(raw/4);const mx=st*Math.ceil(raw/st);
  const y=v=>B-(v/mx)*(B-T);const gx=(W-L-8)/bars.length,bw=Math.min(54,gx*.62);
  const ticks=[];for(let t=0;t<=mx+1e-9;t+=st)ticks.push(t);
  const col=x=>x.k==='b'?'var(--base)':x.k==='t'?'var(--accent)':x.k==='ai'?'var(--ai)':x.v<0?'var(--save)':'var(--hum)';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="워터폴">
   ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"></line><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('')}
   ${bars.map((x,i)=>{const X=L+i*gx+(gx-bw)/2,y1=y(Math.max(x.a,x.b)),y0=y(Math.min(x.a,x.b));const nx=bars[i+1];
     return`<rect x="${X}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1)}" rx="2" fill="${col(x)}" data-tip="${x.l} ${x.k==='d'&&x.v>0?'+':''}${fmt(x.v)}${isMD?' M/D':'만 원'}"></rect>
     <text class="val" x="${X+bw/2}" y="${y1-5}" text-anchor="middle">${x.k==='d'&&x.v>0?'+':''}${fmt(x.v)}</text>
     <text x="${X+bw/2}" y="${H-16}" text-anchor="middle">${x.l}</text>
     ${nx&&x.k!=='t'&&F.wf!=='ai'?`<line x1="${X+bw}" x2="${X+gx}" y1="${y(x.b)}" y2="${y(x.b)}" stroke="var(--fg-3)" stroke-dasharray="2 2"></line>`:''}`;}).join('')}
   <line class="axis" x1="${L}" x2="${W-4}" y1="${B}" y2="${B}"></line></svg>
   <div class="legend">${F.wf==='ai'?'<span><i style="background:var(--ai)"></i>단계별 AI 비용</span>':`<span><i style="background:var(--base)"></i>기준</span><span><i style="background:var(--save)"></i>감소</span><span><i style="background:var(--hum)"></i>증가</span>${F.wf==='cost'?'<span><i style="background:var(--ai)"></i>AI 비용</span>':''}<span><i style="background:var(--accent)"></i>측정 결과</span>`}<span class="muted">${isMD?'M/D':'만 원'}</span></div>`;
}
function stageResult(list,stages){
  const us=unitsIn(list);
  const mx=Math.max(1,...stages.map(c=>{const a=byStage(list,c);return Math.max(a.bc,a.tc);}));
  const bar=a=>`<div class="bars2"><div class="b"><span class="track" style="width:${a.bc/mx*100}%"><i style="width:100%;background:var(--base)"></i></span>${man(a.bc)}</div>
    <div class="b"><span class="track" style="width:${a.tc/mx*100}%"><i style="width:${a.tc?a.lc/a.tc*100:0}%;background:var(--hum)"></i><i style="width:${a.tc?a.ai/a.tc*100:0}%;background:var(--ai)"></i></span>${man(a.lc)} + ${man(a.ai)}</div></div>`;
  let html=`<div class="prow h"><span>SDLC 단계 · 업무 유형</span><span>기준 · 측정 (인건비 + AI)</span><span class="r">공수</span><span class="r hide-s">AI 활용</span><span class="r">순절감</span></div>`;
  stages.forEach(c=>{const su=us.filter(u=>u.s.c===c),a=aggU(su),cl=F.closed.has(c);
    html+=`<div class="prow g ${cl?'closed':''}" data-stg="${c}"><span class="nm">${SN[c]} <span class="xs muted">${su.length}건</span></span>${bar(a)}<span class="r">${pct(a.save)}</span><span class="r hide-s">${pct(a.use)}</span><span class="r">${pct(a.net)}</span></div>`;
    if(!cl)[...new Set(su.map(u=>u.s.wt))].forEach(t=>{const b=aggU(su.filter(u=>u.s.wt===t));
      html+=`<div class="prow s"><span class="nm small">${esc(t)} <span class="xs muted">${su.filter(u=>u.s.wt===t).length}</span></span>${bar(b)}<span class="r small">${pct(b.save)}</span><span class="r small hide-s">${pct(b.use)}</span><span class="r">${pct(b.net)}</span></div>`;});});
  return html+`<div class="legend"><span><i style="background:var(--base)"></i>기준 인건비</span><span><i style="background:var(--hum)"></i>측정 인건비</span><span><i style="background:var(--ai)"></i>AI 비용</span><span class="muted">만 원 · 행을 누르면 업무 유형이 펼쳐짐</span></div>`;
}
function projectResult(list){
  const ps=PROJECTS.filter(p=>list.some(r=>r.pid===p.id));
  const rows=ps.map(p=>{const rs=list.filter(r=>r.pid===p.id);return{p,a:agg(rs),all:REQS.filter(r=>r.pid===p.id&&canSee(r)).length};});
  const mx=Math.max(...rows.map(x=>Math.max(x.a.bc,x.a.tc)))||1;
  const gc='grid-template-columns:minmax(120px,190px) minmax(0,1fr) 60px 60px';
  return`<div class="prow h" style="${gc}"><span>과제</span><span>기준 · 측정 (인건비 + AI)</span><span class="r">공수</span><span class="r">순절감</span></div>`+
  rows.map(({p,a,all})=>`<div class="prow" style="${gc}"><span><b>${esc(p.name)}</b><div class="xs muted"><span class="kind ${p.kind}">${p.kind}</span> 완료 ${a.n}/${all} · AI 활용 ${pct(a.use)}</div></span>
    <div class="bars2"><div class="b"><span class="track" style="width:${a.bc/mx*100}%"><i style="width:100%;background:var(--base)"></i></span>${man(a.bc)}</div>
    <div class="b"><span class="track" style="width:${a.tc/mx*100}%"><i style="width:${a.lc/a.tc*100}%;background:var(--hum)"></i><i style="width:${a.ai/a.tc*100}%;background:var(--ai)"></i></span>${man(a.lc)} + ${man(a.ai)}</div></div>
    <span class="r">${pct(a.save)}</span><span class="r">${pct(a.net)}</span></div>`).join('')+
  (rows.length>1?(()=>{const t=agg(list);return`<div class="prow" style="${gc};border-bottom:0"><span><b>선택 합계</b><div class="xs muted">${t.n}건</div></span><span class="small muted num">${man(t.bc)} → ${man(t.tc)}</span><span class="r">${pct(t.save)}</span><span class="r">${pct(t.net)}</span></div>`;})():'');
}
function scatter(list){
  const W=560,H=300,L=46,Rr=12,T=14,B=H-40;
  const pts=list.map(r=>{const s=reqStats(r);return{r,s,x:s.lc/s.bc-1,y:s.ai/10000,sz:r.base};});
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(-.6,Math.floor(Math.min(...xs)*10)/10-.05),x1=Math.max(.2,Math.ceil(Math.max(...xs)*10)/10+.05),y1=Math.max(5,Math.ceil(Math.max(...ys)/5)*5);
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-Rr),Y=v=>B-v/y1*(B-T);
  const key={kind:r=>prj(r.pid).kind,area:r=>prj(r.pid).area,diff:r=>r.diff,exp:r=>r.exp}[F.color];
  const cats=[...new Set(list.map(key))];const pal=['var(--ai)','var(--hum)','var(--c4)','var(--save)','var(--c6)'];
  const cc=c=>pal[cats.indexOf(c)%pal.length];

  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="요구사항 분포">
   ${[0,.25,.5,.75,1].map(t=>`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${Y(t*y1)}" y2="${Y(t*y1)}"></line><text x="${L-6}" y="${Y(t*y1)+4}" text-anchor="end">${f0(t*y1)}</text>`).join('')}
   ${xt.map(v=>`<text x="${X(v)}" y="${B+16}" text-anchor="middle">${v>0?'+':''}${Math.round(v*100)}%</text>`).join('')}
   <line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${B}" stroke="var(--fg-3)" stroke-dasharray="3 3"></line><text x="${X(0)+4}" y="${B-6}">기준 인건비</text>
   <line class="axis" x1="${L}" x2="${W-Rr}" y1="${B}" y2="${B}"></line>

     return`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${5+Math.sqrt(p.sz)*3.2}" fill="${cc(key(p.r))}" fill-opacity="${p.r.done?.85:.25}" stroke="${cc(key(p.r))}" stroke-width="1.5" data-tip="${esc(p.r.name)} · ${esc(prj(p.r.pid).name)}\n인건비 ${sp(p.x)} · AI 비용 ${f1(p.y)}만 원\n기준 ${f1(p.r.base)} M/D · 순절감 ${pct(net)}${p.r.done?'':'\n측정 중'}"></circle>
     <text class="val" x="${X(p.x)+7+Math.sqrt(p.sz)*3.2}" y="${Y(p.y)+3}">${pct(net)}</text>`;}).join('')}
   <text x="${(L+W)/2}" y="${H-4}" text-anchor="middle">← 인건비 감소 · 인건비 증감률 (측정 ÷ 기준 − 1) · 증가 →</text>
   <text x="12" y="${(T+B)/2}" text-anchor="middle" transform="rotate(-90 12 ${(T+B)/2})">AI 비용 (만 원)</text></svg>
  <div class="legend">${cats.map(c=>`<span><i style="background:${cc(c)};border-radius:50%"></i>${c} ${list.filter(r=>key(r)===c).length}</span>`).join('')}<span class="muted">원 크기 = 기준 M/D · 숫자 = 순절감률${F.inc?' · 옅은 원 = 측정 중':''}</span></div>`;
}

function zipStore(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
  files.forEach(f=>{const nm=enc.encode(f.name),d=enc.encode(f.text),crc=crc32(d),sz=d.length;
    const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,crc,true);l.setUint32(18,sz,true);l.setUint32(22,sz,true);l.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(l.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz;});
  const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
const xe=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colL=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
function sheetXml(rows){const w=rows[0].map((h,c)=>Math.max(8,Math.min(30,Math.max(...rows.slice(0,60).map(r=>String(r[c]??'').length))*1.5+2)));
  const body=rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';
    return typeof v==='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v??'')}</t></is></c>`;}).join('')}</row>`).join('');
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${colL(rows[0].length-1)}${rows.length}"/></worksheet>`;}
function makeXlsx(sets){const n=sets.length;const f=[];
  f.push({name:'[Content_Types].xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`});
  f.push({name:'_rels/.rels',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
  f.push({name:'xl/workbook.xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sets.map((x,i)=>`<sheet name="${xe(x[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`});
  f.push({name:'xl/_rels/workbook.xml.rels',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  f.push({name:'xl/styles.xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="맑은 고딕"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF0F0"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf fontId="0" fillId="0" borderId="0" xfId="0"/><xf fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  sets.forEach((x,i)=>f.push({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(x[1])}));
  return zipStore(f);}
